[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-decision-api"
version = "0.1.0"
description = "An HTTP job API for the paper's frozen v12 diagram extractor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<13",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "typesafe-sdk[pil]==0.7.5",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["cad_api*"]

[tool.setuptools.package-data]
cad_api = ["resources/**/*.json", "resources/**/*.png", "resources/*.md", "vendor/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

