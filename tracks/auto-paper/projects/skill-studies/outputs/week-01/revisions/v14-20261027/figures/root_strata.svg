<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="15" fill="#17212b"><text x="65" y="28" >Complete-diagnosis regressions by original root range</text><text x="65" y="53" >Same 421 exposed cycles; counts, not independent trials</text><text x="65" y="130" >Inside original range</text><rect x="265" y="105" width="320" height="32" fill="white" stroke="#0072b2" stroke-width="3" /><text x="595" y="130" >8 regressions / 39 cycles</text><text x="65" y="235" >Outside original range</text><rect x="265" y="210" width="80" height="32" fill="white" stroke="#d55e00" stroke-width="3" stroke-dasharray="6 3"/><text x="355" y="235" >2 regressions / 382 cycles</text><text x="65" y="310" >8 of 10 regressions occur inside the fit min/max range.</text><text x="65" y="340" >Range membership is descriptive; it is not density support or a causal rule.</text></g></svg>