<svg xmlns="http://www.w3.org/2000/svg" width="980" height="345" viewBox="0 0 980 345"><rect width="980" height="345" fill="white"/><g font-family="Arial,sans-serif" fill="#182b3b"><text x="20" y="28" font-size="20" font-weight="bold" fill="#182b3b" text-anchor="start">Same world model; two different bound directions</text><rect x="20" y="50" width="452" height="174" rx="8" fill="#e7eff7" stroke="#31516e"/><text x="38" y="78" font-size="17" font-weight="bold" fill="#182b3b" text-anchor="start">OUTER: minimize subset risk R(S)</text><text x="38" y="111" font-size="16" font-weight="normal" fill="#182b3b" text-anchor="start">I subset S subset M = I union U</text><text x="38" y="142" font-size="16" font-weight="normal" fill="#182b3b" text-anchor="start">Verified feasible M reading projects to S.</text><text x="38" y="176" font-size="17" font-weight="bold" fill="#182b3b" text-anchor="start">W(M,zM) &lt;= W(S,zS) &lt;= R(S)</text><text x="38" y="207" font-size="14" font-weight="normal" fill="#182b3b" text-anchor="start">Optimistic M may be unaffordable; it is not executed.</text><rect x="508" y="50" width="452" height="174" rx="8" fill="#f5eee4" stroke="#8a633e"/><text x="526" y="78" font-size="17" font-weight="bold" fill="#182b3b" text-anchor="start">INNER: maximize transcript width</text><text x="526" y="111" font-size="16" font-weight="normal" fill="#182b3b" text-anchor="start">Complete z refines partial prefix h.</text><text x="526" y="142" font-size="16" font-weight="normal" fill="#182b3b" text-anchor="start">Omega(z) subset Omega(h)</text><text x="526" y="176" font-size="17" font-weight="bold" fill="#182b3b" text-anchor="start">W(z) &lt;= W(h): prefix is an UPPER bound.</text><text x="526" y="207" font-size="14" font-weight="normal" fill="#182b3b" text-anchor="start">&lt;= pruning keeps one witness; all ties require &lt;.</text><text x="20" y="258" font-size="17" font-weight="bold" fill="#182b3b" text-anchor="start">Hard Q4 saved epsilon certificate</text><text x="20" y="291" font-size="17" font-weight="normal" fill="#182b3b" text-anchor="start">LB = 97/320    UB = 21/64 = 105/320</text><text x="20" y="324" font-size="16" font-weight="normal" fill="#182b3b" text-anchor="start">Gap = 1/40 &lt;= epsilon = 1/32; observed finite-oracle regret = 0.</text></g></svg>