<svg xmlns="http://www.w3.org/2000/svg" width="900" height="355" viewBox="0 0 900 355"><rect width="900" height="355" fill="white"/><g font-family="Arial, sans-serif" fill="#142333"><text x="18" y="26" font-size="19" font-weight="bold" text-anchor="start" fill="#142333">One frozen predictor; separate information and cost rights</text><rect x="18" y="50" width="252" height="112" rx="7" fill="#eaf0f6" stroke="#465a6b" stroke-width="1.4"/><text x="30" y="74" font-size="17" font-weight="bold" text-anchor="start" fill="#142333">O  Observed source</text><text x="30" y="99" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Local completed windows</text><text x="30" y="119" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Full data: fitting/evaluator rights</text><text x="30" y="139" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Not an actor feature cache</text><rect x="324" y="50" width="252" height="112" rx="7" fill="#eaf0f6" stroke="#465a6b" stroke-width="1.4"/><text x="336" y="74" font-size="17" font-weight="bold" text-anchor="start" fill="#142333">C  Internal computation</text><text x="336" y="99" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Frozen summaries / mask predictions</text><text x="336" y="119" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Complete-row weighted estimator</text><text x="336" y="139" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Risk and transitions: one law</text><rect x="630" y="50" width="252" height="112" rx="7" fill="#dcecf5" stroke="#465a6b" stroke-width="1.4"/><text x="642" y="74" font-size="17" font-weight="bold" text-anchor="start" fill="#142333">X  Public actor input</text><text x="642" y="99" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Paid values/tokens and mask</text><text x="642" y="119" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Attempt history / remaining cap</text><text x="642" y="139" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">No hidden values or labels</text><line x1="270" y1="103" x2="324" y2="103" stroke="#465a6b" stroke-width="1.6"/><polygon points="324,103 317,99 317,107" fill="#465a6b"/><line x1="576" y1="103" x2="630" y2="103" stroke="#465a6b" stroke-width="1.6"/><polygon points="630,103 623,99 623,107" fill="#465a6b"/><text x="590" y="88" font-size="13" font-weight="normal" text-anchor="middle" fill="#142333">paid</text><rect x="18" y="218" width="252" height="112" rx="7" fill="#f4f0e8" stroke="#465a6b" stroke-width="1.4"/><text x="30" y="242" font-size="17" font-weight="bold" text-anchor="start" fill="#142333">Evaluator / gold labels</text><text x="30" y="267" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Score only after decisions</text><text x="30" y="287" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Same windows and participant means</text><text x="30" y="307" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Retain harms, failures and abstention</text><rect x="324" y="218" width="252" height="112" rx="7" fill="#eaf0f6" stroke="#465a6b" stroke-width="1.4"/><text x="336" y="242" font-size="17" font-weight="bold" text-anchor="start" fill="#142333">Executor / attempt ledger</text><text x="336" y="267" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Charge selected attempt on failure</text><text x="336" y="287" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Return selected data or failure</text><text x="336" y="307" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">S successes; T all attempts</text><rect x="630" y="218" width="252" height="112" rx="7" fill="#dcecf5" stroke="#465a6b" stroke-width="1.4"/><text x="642" y="242" font-size="17" font-weight="bold" text-anchor="start" fill="#142333">Policy / purchased cache</text><text x="642" y="267" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">STOP, permitted ABSTAIN or action</text><text x="642" y="287" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Reuse only disclosed cache values</text><text x="642" y="307" font-size="14" font-weight="normal" text-anchor="start" fill="#142333">Static and adaptive: equal rights</text><line x1="756" y1="162" x2="756" y2="218" stroke="#465a6b" stroke-width="1.6"/><polygon points="756,218 752,211 760,211" fill="#465a6b"/><line x1="630" y1="273" x2="576" y2="273" stroke="#465a6b" stroke-width="1.6"/><polygon points="576,273 583,269 583,277" fill="#465a6b"/><line x1="324" y1="273" x2="270" y2="273" stroke="#465a6b" stroke-width="1.6"/><polygon points="270,273 277,269 277,277" fill="#465a6b"/><line x1="450" y1="218" x2="450" y2="163" stroke="#465a6b" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="450,163 446,170 454,170" fill="#465a6b"/><text x="465" y="196" font-size="13" font-weight="normal" text-anchor="start" fill="#142333">selected return only</text></g></svg>