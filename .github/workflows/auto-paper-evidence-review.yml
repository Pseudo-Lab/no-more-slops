name: Auto-Paper evidence and local review
on:
  pull_request:
    paths: ['tracks/auto-paper/skills/experiment-to-paper/**', 'tracks/auto-paper/skills/paper-review-local/**', 'tracks/auto-paper/projects/dcsm-spatial/tests/**', '.github/workflows/auto-paper-evidence-review.yml']
  push:
    paths: ['tracks/auto-paper/skills/experiment-to-paper/**', 'tracks/auto-paper/skills/paper-review-local/**', 'tracks/auto-paper/projects/dcsm-spatial/tests/**', '.github/workflows/auto-paper-evidence-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tracks/auto-paper/skills/paper-review-local/scripts/requirements-mcp.txt
      - run: sudo apt-get update && sudo apt-get install -y chktex
      - run: python -B -m unittest discover -s tracks/auto-paper/projects/dcsm-spatial/tests -v
